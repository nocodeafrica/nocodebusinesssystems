# Storage Configuration
[storage]
enabled = true
file_size_limit = "50MiB"
buckets = [
  { name = "models", public = true, file_size_limit = "50MiB", allowed_mime_types = ["model/gltf-binary", "model/gltf+json", "application/octet-stream"] },
  { name = "images", public = true, file_size_limit = "10MiB", allowed_mime_types = ["image/*"] },
  { name = "documents", public = false, file_size_limit = "20MiB" }
]

# Edge Functions Configuration
[functions]
enabled = true

# Realtime Configuration
[realtime]
enabled = true

# Studio Configuration
[studio]
enabled = true
port = 54323

# Analytics Configuration
[analytics]
